name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format, unit tests, integration tests, coverage, package
        run: mvn -B -ntp clean verify
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build packaged image and enforce Java 21 runtime
        run: |
          docker build -t ledgercore:ci .
          docker run --rm --entrypoint java ledgercore:ci -version 2>&1 | grep -E 'version "21[.]'
      - name: Check backup and restore safety guards
        run: python3 scripts/test_database_tools.py
      - name: Scan resolved runtime dependencies against OSV
        run: python3 scripts/scan-dependencies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verification-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
            target/bom.json
            target/classes/META-INF/sbom/application.cdx.json
            target/security/
          retention-days: 14
