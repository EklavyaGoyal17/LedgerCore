logging:
  level:
    root: WARN
    org.testcontainers: INFO
    com.ledgercore: INFO
management:
  tracing:
    sampling:
      probability: 0
spring:
  kafka:
    listener:
      auto-startup: false
ledgercore:
  events:
    enabled: false
  rate-limit:
    enabled: false
  security:
    jwt-secret: test-only-secret-which-is-more-than-32-bytes-long
