name: ledgercore
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ledgercore
      POSTGRES_USER: ledgercore
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-ledgercore-db-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ledgercore -d ledgercore']
      interval: 5s
      timeout: 3s
      retries: 20
  db-bootstrap:
    image: postgres:17.6-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ledgercore
      PGUSER: ledgercore
      PGPASSWORD: ${DATABASE_PASSWORD:-local-ledgercore-db-change-me}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:-local-migration-change-me}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:-local-runtime-change-me}
    volumes:
      - ./infrastructure/postgres/bootstrap.sql:/bootstrap.sql:ro
    entrypoint: [sh, -ec]
    command:
      - 'psql -v ON_ERROR_STOP=1 -v migration_password="$$MIGRATION_PASSWORD" -v runtime_password="$$RUNTIME_PASSWORD" -f /bootstrap.sql'
    depends_on:
      postgres: {condition: service_healthy}
  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30
  migrate:
    image: ledgercore-backend:local
    build: .
    command: [--migrate-only]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ledgercore
      FLYWAY_USER: ledgercore_migrator
      FLYWAY_PASSWORD: ${MIGRATION_PASSWORD:-local-migration-change-me}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: {disable: true}
    depends_on:
      db-bootstrap: {condition: service_completed_successfully}
  backend:
    image: ledgercore-backend:local
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ledgercore
      DATABASE_USER: ledgercore_runtime
      DATABASE_PASSWORD: ${RUNTIME_PASSWORD:-local-runtime-change-me}
      SPRING_FLYWAY_ENABLED: 'false'
      JWT_SECRET: ${JWT_SECRET:-local-simulation-only-replace-with-at-least-32-random-bytes}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ledgercore.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-password-change-me}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACE_SAMPLE_PROBABILITY: ${TRACE_SAMPLE_PROBABILITY:-0.1}
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-grafana-change-me}
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
  tempo:
    image: grafana/tempo:2.8.2
    command: [-config.file=/etc/tempo.yml]
    volumes:
      - ./infrastructure/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  tempo-data:
